<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#dacfba" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="preload" as="image" type="image/webp" href="/brand/wordmark.webp" fetchpriority="high" crossorigin />
    <title>Archió | Interior design studio</title>
    <meta name="description" content="Archió is a Dubai interior design consultancy for residential, commercial and mixed-use spaces, and a unit of Beracah Trading." />
    <!-- No canonical link here: every address is served this file, so a fixed one would point every page at the home
         page. Seo.jsx adds the right one for each page. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Archió" />
    <meta property="og:title" content="Archió | Interior design studio" />
    <meta property="og:description" content="Consultancy-led interior design for residential, commercial and mixed-use spaces in Dubai." />
    <meta property="og:image" content="__SITE_URL__/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="/src/styles/preloader.css" />
    <!-- Decides before first paint whether this tab has already seen the loading screen (see the file). -->
    <script src="/preloader-gate.js"></script>
  </head>
  <body>
    <div id="app-preloader" aria-hidden="true">
      <div class="app-preloader__inner">
        <img class="app-preloader__mark" src="/brand/logo-mark.png" alt="" width="64" height="62" />
        <span class="app-preloader__word"><i>A</i><i>R</i><i>C</i><i>H</i><i>I</i><i>Ó</i></span>
        <span class="app-preloader__line"></span>
      </div>
    </div>
    <div id="root"></div>
    <noscript><p class="noscript-note">Archió needs JavaScript to run. Please enable it, or write to <a href="mailto:info@beracahlogistics.com">info@beracahlogistics.com</a>.</p></noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
